[project]
name = "ha-evctrl"
version = "1.3.5"
description = "Home Assistant integration for EV & P1 controller."
readme = "README.md"
requires-python = ">=3.14.2"
license = "AGPL-3.0-only"
dependencies = [
  "homeassistant>=2026.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1",
  "ruff>=0.16.1",
  "ty>=0.0.69",
]

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "SIM", "FBT"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.14"
